name: Build Unsigned DMG

on:
  push:
    branches:
      - moe
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned DMG
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Chicken App and DMG
        run: |
          xcodebuild \
            -project cotvnc/Chicken.xcodeproj \
            -scheme Chicken \
            -configuration Deployment \
            -derivedDataPath ./DerivedData \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS="x86_64 arm64" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Prepare and Verify DMG
        run: |
          mkdir -p dist

          # Locate built Chicken.app
          APP_PATH=$(find ./DerivedData -name "Chicken.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: Chicken.app not found in DerivedData!"
            exit 1
          fi
          echo "Found Chicken.app at: $APP_PATH"

          # Verify signature status of the application bundle
          echo "=== Code Signature Verification ==="
          codesign -dv "$APP_PATH" 2>&1 || true
          echo "==================================="

          # Check if Xcode build phase already generated the DMG
          DMG_FILE=$(find ./DerivedData -name "*.dmg" -type f | head -n 1)

          if [ -n "$DMG_FILE" ] && [ -f "$DMG_FILE" ]; then
            echo "Found DMG generated by build phase: $DMG_FILE"
            cp "$DMG_FILE" dist/
          else
            echo "DMG not found in DerivedData, packaging DMG from $APP_PATH..."
            VERSION=$(defaults read "$(pwd)/$APP_PATH/Contents/Info.plist" CFBundleShortVersionString 2>/dev/null || echo "")
            if [ -n "$VERSION" ]; then
              OUTPUT_DMG="dist/Chicken_${VERSION}.dmg"
            else
              OUTPUT_DMG="dist/Chicken.dmg"
            fi
            hdiutil create -volname "Chicken" -srcfolder "$APP_PATH" -ov -format UDZO "$OUTPUT_DMG"
          fi

          echo "=== Artifact Details ==="
          ls -lh dist/
          shasum -a 256 dist/*.dmg
          echo "========================"

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chicken-DMG
          path: dist/*.dmg
          if-no-files-found: error
