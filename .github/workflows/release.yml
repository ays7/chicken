name: Publish Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to publish (leave empty to use Info.plist version)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    name: Build, Sign, Notarize and Publish Release DMG
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build Chicken Fork App
        run: |
          xcodebuild \
            -project cotvnc/ChickenFork.xcodeproj \
            -scheme "Chicken Fork" \
            -configuration Deployment \
            -derivedDataPath ./DerivedData \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS="x86_64 arm64" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Sign, Package, Notarize and Staple DMG
        id: package
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          ./scripts/sign_and_notarize.sh

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_TAG: ${{ github.ref_name }}
          INPUT_TAG: ${{ github.event.inputs.tag_name }}
          DMG_PATH: ${{ steps.package.outputs.dmg_path }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          TAG_NAME="${INPUT_TAG}"
          if [ -z "$TAG_NAME" ]; then
            if [ "${{ github.event_name }}" = "push" ]; then
              TAG_NAME="$EVENT_TAG"
            else
              TAG_NAME="v${VERSION}"
            fi
          fi

          CLEAN_VERSION="${TAG_NAME#v}"
          NOTES_FILE=""
          if [ -f "release-notes/${CLEAN_VERSION}.md" ]; then
            NOTES_FILE="release-notes/${CLEAN_VERSION}.md"
          elif [ -f "release-notes/${TAG_NAME}.md" ]; then
            NOTES_FILE="release-notes/${TAG_NAME}.md"
          fi

          echo "Publishing release for tag: $TAG_NAME"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release for $TAG_NAME already exists, uploading asset..."
            gh release upload "$TAG_NAME" "$DMG_PATH" --clobber
          else
            if [ -n "$NOTES_FILE" ]; then
              echo "Using release notes file: $NOTES_FILE"
              gh release create "$TAG_NAME" "$DMG_PATH" \
                --title "${TAG_NAME}" \
                --notes-file "$NOTES_FILE"
            else
              echo "Generating release notes automatically"
              gh release create "$TAG_NAME" "$DMG_PATH" \
                --title "${TAG_NAME}" \
                --generate-notes
            fi
          fi
